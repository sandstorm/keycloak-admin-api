# Standalone task runner for the keycloak-admin-api library. Run from this directory:
#   mise run install
#   mise run test
# The library is self-contained (its own vendor/); it does not borrow any sibling package's toolchain.

[tasks.install]
description = "Install Composer dependencies (PHPUnit, PHPStan, Guzzle)"
dir = "{{config_root}}"
run = "composer install"

[tasks.test]
description = "Run the unit test suite (no I/O, no Keycloak)"
dir = "{{config_root}}"
run = "vendor/bin/phpunit --testsuite unit"

[tasks.analyse]
description = "Static analysis"
dir = "{{config_root}}"
run = "vendor/bin/phpstan analyse src --level=6"

# --- End-to-end: real Keycloak in Docker (opt-in) ---------------------------------------------------

[tasks."e2e:up"]
description = "Boot a throwaway Keycloak 26.5.3 with the test realm imported"
dir = "{{config_root}}"
run = "docker compose -f tests/Integration/docker-compose.yml up -d --wait"

[tasks."e2e:down"]
description = "Tear the throwaway Keycloak down (and drop its volumes)"
dir = "{{config_root}}"
run = "docker compose -f tests/Integration/docker-compose.yml down -v"

[tasks."test:integration"]
description = "Run the end-to-end suite against the booted Keycloak"
dir = "{{config_root}}"
env = { KEYCLOAK_E2E_BASE_URL = "http://localhost:9911" }
run = "vendor/bin/phpunit --testsuite integration"

[tasks.e2e]
description = "Full E2E cycle: boot Keycloak, run the integration suite, tear down"
dir = "{{config_root}}"
run = [
    "mise run e2e:up",
    "mise run test:integration",
    "mise run e2e:down",
]

# --- Keycloak REST API surface (source of truth for the README coverage table) ----------------------

[tasks."kc:routes"]
description = "Download the Keycloak Admin REST OpenAPI and print every route as: TAG<TAB>METHOD<TAB>PATH (sorted)"
dir = "{{config_root}}"
env = { KC_OPENAPI_URL = "https://www.keycloak.org/docs-api/latest/rest-api/openapi.json" }
run = '''
curl -fsSL "$KC_OPENAPI_URL" \
  | jq -r '
      .paths | to_entries[] as $p
      | $p.value | to_entries[]
      | select(.key | IN("get","post","put","delete","patch"))
      | [(.value.tags[0] // "untagged"), (.key | ascii_upcase), $p.key]
      | @tsv
    ' \
  | sort
'''

[tasks."kc:routes:count"]
description = "Count Keycloak Admin REST routes per resource-group tag (how big each group is)"
dir = "{{config_root}}"
run = "mise run kc:routes | cut -f1 | uniq -c | sort -rn"
